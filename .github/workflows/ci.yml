name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The two jobs are independent and run in parallel; either failing fails the run.
jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Production-like settings (DEBUG off: whitenoise, secure cookies, hashed
      # static files), except the HTTPS redirect, which would answer every test
      # request with a 301. A throwaway key: nothing here is secret.
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      # No DATABASE_URL: tests run on SQLite. For full parity with production,
      # a `services: postgres:` container (postgres:16) plus DATABASE_URL here
      # would run the same suite against PostgreSQL.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run

      - name: Type check (mypy)
        run: mypy .

      - name: Tests
        run: python manage.py test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build
